[package]
name = "mydna"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mydna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15.7"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
uiautomation = "0.3"
clipboard-win = "5.4"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
notify = "8.2.0"
regex = "1.13.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_SystemInformation"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.5", features = ["v4"] }
similar = "3.1.1"
axum = "0.8.9"
serde_yaml = "0.9.34"
keyring = "4.1.4"
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
rand = "0.10.2"
ed25519-dalek = "3.0.0"
libp2p = { version = "0.54", features = ["tokio", "tcp", "noise", "yamux", "kad", "identify", "ping", "gossipsub", "request-response", "macros", "autonat", "relay", "dcutr"] }
libp2p-request-response = { version = "0.27", features = ["cbor"] }

